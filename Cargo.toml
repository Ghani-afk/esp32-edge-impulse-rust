[package]
name = "enose-wifi"
version = "0.1.0"
edition = "2021"
resolver = "2"

[[bin]]
name = "enose-wifi"
harness = false

[dependencies]
esp-backtrace = { version = "0.14.2", default-features = false, features = ["esp32s3", "panic-handler", "println"] }
esp-hal = { version = "0.22.0", default-features = false, features = ["esp32s3"] }
esp-hal-embassy = { version = "0.5.0", features = ["esp32s3"] }
esp-wifi = { version = "0.11.0", default-features = false, features = ["esp32s3", "wifi"] }
esp-println = { version = "0.12.0", default-features = false, features = ["esp32s3", "log", "auto"] }
esp-alloc = "0.5.0"

embassy-executor = { version = "0.6.0", features = ["task-arena-size-12288"] }
embassy-time = { version = "0.3.2", features = ["generic-queue-8"] }
embassy-net = { version = "0.4.0", features = ["tcp", "udp", "dhcpv4", "dns"] }

tinymqtt = "0.1.3"
static_cell = "2.1.0"
heapless = "0.8.0"
embedded-hal = "0.2.7"
dht-sensor = "0.2.1"
log = { version = "0.4.22", default-features = false }

[profile.release]
opt-level = "s"

[profile.dev]
opt-level = "z"

[patch.crates-io]
void = { path = "void-fix" }